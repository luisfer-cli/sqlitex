[project]
name = "sqlitex"
version = "0.1.0"
description = "Explore SQLite databases and query them in natural language (RAG + NL2SQL)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luis" }]
keywords = ["sqlite", "cli", "rag", "nl2sql", "llm", "data"]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pydantic>=2.8",
]

[project.scripts]
sqlitex = "sqlitex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlitex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
